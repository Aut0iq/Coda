# Music Hub: API скачивания + Navidrome + Caddy (HTTPS).
# Все настройки — в .env рядом (его пишет установщик).
name: music-hub

services:
  api:
    image: ${HUB_API_IMAGE:-ghcr.io/aut0iq/music-hub-api:latest}
    build:
      context: ./api
      args:
        REG: ${REG:-docker.io/}
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HUB_TOKEN: ${HUB_TOKEN}
      ND_URL: http://navidrome:4533
      ND_USER: ${ND_USER}
      ND_PASS: ${ND_PASS}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8081"
      TZ: ${TZ:-UTC}
    volumes:
      - ${HUB_MUSIC_DIR:-./data/music}:/music
      - ./data/hub:/data
    depends_on:
      navidrome:
        condition: service_healthy
    expose:
      - "8081"

  navidrome:
    image: ${REG:-docker.io/}deluan/navidrome:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      ND_SCANSCHEDULE: "@every 6h"
      ND_SESSIONTIMEOUT: 720h
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_LOGLEVEL: info
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/navidrome:/data
      - ${HUB_MUSIC_DIR:-./data/music}:/music:ro
    expose:
      - "4533"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4533/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: ${REG:-docker.io/}library/caddy:2
    restart: unless-stopped
    ports:
      # HUB_*_BIND: «80» или «8080» — порт на всех адресах; «127.0.0.1:» — случайный порт
      # только на localhost (так закрывается 443, когда HTTPS не нужен)
      - "${HUB_HTTP_BIND:-80}:80"
      - "${HUB_HTTPS_BIND:-443}:443"
    environment:
      HUB_ADDR: ${HUB_ADDR}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - navidrome

volumes:
  caddy_data:
  caddy_config:
