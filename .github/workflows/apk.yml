name: apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABI (arm64-v8a — почти все телефоны; добавь x86_64 для эмулятора)'
        default: 'arm64-v8a'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: gradle/actions/setup-gradle@v4

      - name: Зависимости (postinstall собирает пакет сервера в приложение)
        working-directory: app
        run: |
          npm install
          npx expo install --fix

      - name: Тесты приложения
        working-directory: app
        run: npm test

      - name: Нативный проект
        working-directory: app
        run: npx expo prebuild --platform android --clean

      - name: Сборка APK
        working-directory: app/android
        run: |
          ABIS="${{ github.event.inputs.abis || 'arm64-v8a' }}"
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="$ABIS"

      - name: Имя файла
        id: apk
        run: |
          VER="$(node -p "require('./app/package.json').version")"
          NAME="coda-${VER}.apk"
          cp app/android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: coda-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
